[pytest]
# Collection contract for the LP agent tree (2026-11-03).
#
# WHY THIS EXISTS: a bare `pytest` from the tree root used to die with
# "import file mismatch" because tests_canonical/ held byte-identical copies of
# three test modules, and archive/ held a retired test with a stale import.
# Neither directory is a test suite: tests_canonical/ was redundant kernel-reap
# insurance (the real backup is ~/.hermes/lp_tests_canonical/) and archive/ is
# the quarantine — retired code kept for audit, never executed.
#
# Only tests/ is a suite. Everything else is data.
testpaths = tests
norecursedirs = archive tests_canonical agentos bin reports references .git .venv __pycache__ .pytest_cache
